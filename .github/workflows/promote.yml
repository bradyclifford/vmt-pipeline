name: Promote Pipeline/Model

on:
  workflow_dispatch:
    inputs:
      promotion_type:
        description: 'Type of promotion'
        required: true
        type: choice
        options:
          - pipeline
          - model
          - both
      version:
        description: 'SemVer version (e.g., 1.2.3)'
        required: true
      environment:
        description: 'Target environment for promotion'
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod
      auto_apply:
        description: 'Automatically apply to Stage/Prod after tests pass?'
        required: false
        type: boolean
        default: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.event.inputs.version }}
          release_name: Release v${{ github.event.inputs.version }}
          body: |
            Promotion of ${{ github.event.inputs.promotion_type }} to version ${{ github.event.inputs.version }}
            
            Environment: ${{ github.event.inputs.environment }}
            Auto-apply: ${{ github.event.inputs.auto_apply }}
          draft: false
          prerelease: ${{ github.event.inputs.environment != 'prod' }}

  deploy-to-dev-qa:
    needs: create-release
    runs-on: ubuntu-latest
    if: github.event.inputs.promotion_type == 'pipeline' || github.event.inputs.promotion_type == 'both'
    
    strategy:
      matrix:
        env: [dev, qa]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        ref: v${{ github.event.inputs.version }}

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets[format('DATABRICKS_HOST_{0}', matrix.env)] }}
          DATABRICKS_TOKEN: ${{ secrets[format('DATABRICKS_TOKEN_{0}', matrix.env)] }}
        run: |
          databricks configure --token << EOF
          ${{ secrets[format('DATABRICKS_HOST_{0}', matrix.env)] }}
          ${{ secrets[format('DATABRICKS_TOKEN_{0}', matrix.env)] }}
          EOF

      - name: Deploy Bundle
        env:
          DATABRICKS_HOST: ${{ secrets[format('DATABRICKS_HOST_{0}', matrix.env)] }}
          DATABRICKS_TOKEN: ${{ secrets[format('DATABRICKS_TOKEN_{0}', matrix.env)] }}
          GITHUB_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_REF_NAME: v${{ github.event.inputs.version }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          MODEL_REPO_ORG: ${{ vars.MODEL_REPO_ORG }}
          MODEL_REPO_NAME: ${{ vars.MODEL_REPO_NAME }}
          GITHUB_RELEASE_TAG: v${{ github.event.inputs.version }}
          MODEL_REPO_TAG: ${{ github.event.inputs.model_repo_tag || 'main' }}
        run: |
          databricks bundle validate -t ${{ matrix.env }}
          databricks bundle deploy -t ${{ matrix.env }}

  run-tests:
    needs: deploy-to-dev-qa
    runs-on: ubuntu-latest
    if: github.event.inputs.promotion_type == 'pipeline' || github.event.inputs.promotion_type == 'both'
    
    strategy:
      matrix:
        env: [dev, qa]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        ref: v${{ github.event.inputs.version }}

      - name: Run Integration Tests
        uses: ./.github/workflows/run_pipeline.yml
        with:
          job_name: default
          environment: ${{ matrix.env }}
          model_tag: main

  deploy-to-stage-prod:
    needs: [create-release, run-tests]
    runs-on: ubuntu-latest
    if: |
      (github.event.inputs.promotion_type == 'pipeline' || github.event.inputs.promotion_type == 'both') &&
      (github.event.inputs.auto_apply == true || github.event.inputs.environment == 'stage' || github.event.inputs.environment == 'prod')
    
    strategy:
      matrix:
        env: 
          - ${{ github.event.inputs.environment == 'stage' && 'stage' || '' }}
          - ${{ github.event.inputs.environment == 'prod' && 'prod' || '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        ref: v${{ github.event.inputs.version }}

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets[format('DATABRICKS_HOST_{0}', matrix.env)] }}
          DATABRICKS_TOKEN: ${{ secrets[format('DATABRICKS_TOKEN_{0}', matrix.env)] }}
        run: |
          databricks configure --token << EOF
          ${{ secrets[format('DATABRICKS_HOST_{0}', matrix.env)] }}
          ${{ secrets[format('DATABRICKS_TOKEN_{0}', matrix.env)] }}
          EOF

      - name: Deploy Bundle
        env:
          DATABRICKS_HOST: ${{ secrets[format('DATABRICKS_HOST_{0}', matrix.env)] }}
          DATABRICKS_TOKEN: ${{ secrets[format('DATABRICKS_TOKEN_{0}', matrix.env)] }}
          GITHUB_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_REF_NAME: v${{ github.event.inputs.version }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          MODEL_REPO_ORG: ${{ vars.MODEL_REPO_ORG }}
          MODEL_REPO_NAME: ${{ vars.MODEL_REPO_NAME }}
          GITHUB_RELEASE_TAG: v${{ github.event.inputs.version }}
          MODEL_REPO_TAG: ${{ github.event.inputs.model_repo_tag || 'main' }}
        run: |
          databricks bundle validate -t ${{ matrix.env }}
          databricks bundle deploy -t ${{ matrix.env }}

  update-vmt-datastore:
    needs: [create-release, deploy-to-stage-prod]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        ref: v${{ github.event.inputs.version }}

      - name: Update VMT Data Store
        run: |
          python scripts/update_vmt_datastore.py \
            --promotion-type ${{ github.event.inputs.promotion_type }} \
            --version ${{ github.event.inputs.version }} \
            --environment ${{ github.event.inputs.environment }}

