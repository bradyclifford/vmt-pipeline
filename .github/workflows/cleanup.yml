name: Cleanup Failed Runs

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to clean up'
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod
      days_old:
        description: 'Clean up runs older than this many days'
        required: false
        default: '7'
      dry_run:
        description: 'Dry run (do not actually delete)'
        required: false
        type: boolean
        default: true
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks configure --token << EOF
          ${{ secrets.DATABRICKS_HOST }}
          ${{ secrets.DATABRICKS_TOKEN }}
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run cleanup script
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          DAYS_OLD: ${{ github.event.inputs.days_old || '7' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          python scripts/cleanup_failed_runs.py \
            --environment ${ENVIRONMENT} \
            --days-old ${DAYS_OLD} \
            --dry-run ${DRY_RUN}

