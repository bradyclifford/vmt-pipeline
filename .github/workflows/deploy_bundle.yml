name: Deploy Databricks Bundle

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod
      github_release_tag:
        description: 'GitHub release tag (e.g., v1.0.0)'
        required: false
        default: 'latest'
      model_repo_tag:
        description: 'Model repository tag/branch'
        required: false
        default: 'main'
  push:
    branches:
      - main
    tags:
      - 'v*'  # Trigger on version tags

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for tags
      
      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            RELEASE_TAG="${{ github.event.inputs.github_release_tag }}"
          elif [ -n "${{ github.ref }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="latest"
          fi
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Using release tag: ${RELEASE_TAG}"
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1
      
      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks configure --token << EOF
          ${{ secrets.DATABRICKS_HOST }}
          ${{ secrets.DATABRICKS_TOKEN }}
          EOF
      
      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          GITHUB_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          MODEL_REPO_ORG: ${{ vars.MODEL_REPO_ORG }}
          MODEL_REPO_NAME: ${{ vars.MODEL_REPO_NAME }}
          GITHUB_RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
          MODEL_REPO_TAG: ${{ github.event.inputs.model_repo_tag || 'main' }}
        run: |
          databricks bundle validate -t ${{ github.event.inputs.environment || 'dev' }}
      
      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          GITHUB_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          MODEL_REPO_ORG: ${{ vars.MODEL_REPO_ORG }}
          MODEL_REPO_NAME: ${{ vars.MODEL_REPO_NAME }}
          GITHUB_RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
          MODEL_REPO_TAG: ${{ github.event.inputs.model_repo_tag || 'main' }}
        run: |
          echo "Deploying bundle to ${{ github.event.inputs.environment || 'dev' }}"
          echo "Release tag: ${{ steps.release_tag.outputs.release_tag }}"
          echo "Model repo tag: ${{ github.event.inputs.model_repo_tag || 'main' }}"
          
          databricks bundle deploy -t ${{ github.event.inputs.environment || 'dev' }}
      
      - name: Output deployment info
        run: |
          echo "✅ Bundle deployed successfully"
          echo "Environment: ${{ github.event.inputs.environment || 'dev' }}"
          echo "Release tag: ${{ steps.release_tag.outputs.release_tag }}"
          echo "Model repo tag: ${{ github.event.inputs.model_repo_tag || 'main' }}"

