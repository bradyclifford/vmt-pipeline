name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-job-definitions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema

      - name: Validate YAML job definitions
        run: |
          python scripts/validate_job_definitions.py

      - name: Check job-model alignment
        run: |
          python scripts/validate_job_model_alignment.py

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Init
        uses: hashicorp/terraform-github-actions@v2
        with:
          tf_actions_version: latest
          tf_actions_subcommand: init
        env:
          TF_ACTION_WORKING_DIR: terraform

      - name: Terraform Validate
        uses: hashicorp/terraform-github-actions@v2
        with:
          tf_actions_version: latest
          tf_actions_subcommand: validate
        env:
          TF_ACTION_WORKING_DIR: terraform

      - name: Terraform Plan (Dry Run)
        uses: hashicorp/terraform-github-actions@v2
        with:
          tf_actions_version: latest
          tf_actions_subcommand: plan
        env:
          TF_ACTION_WORKING_DIR: terraform
          TF_VAR_databricks_host: ${{ secrets.DATABRICKS_HOST }}
          TF_VAR_databricks_token: ${{ secrets.DATABRICKS_TOKEN }}
          TF_VAR_environment: dev

  run-smoke-tests:
    runs-on: ubuntu-latest
    needs: [validate-job-definitions, validate-terraform]
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run smoke tests
        run: |
          pytest tests/smoke/ -v

