name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-job-definitions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema

      - name: Validate YAML job definitions
        run: |
          python scripts/validate_job_definitions.py

      - name: Check job-model alignment
        run: |
          python scripts/validate_job_model_alignment.py

  validate-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks configure --token << EOF
          ${{ secrets.DATABRICKS_HOST }}
          ${{ secrets.DATABRICKS_TOKEN }}
          EOF

      - name: Validate Bundle
        env:
          GITHUB_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          MODEL_REPO_ORG: ${{ vars.MODEL_REPO_ORG }}
          MODEL_REPO_NAME: ${{ vars.MODEL_REPO_NAME }}
          GITHUB_RELEASE_TAG: "latest"
          MODEL_REPO_TAG: "main"
        run: |
          databricks bundle validate -t dev

      - name: Bundle Dry Run (Validate Deployment)
        env:
          GITHUB_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          MODEL_REPO_ORG: ${{ vars.MODEL_REPO_ORG }}
          MODEL_REPO_NAME: ${{ vars.MODEL_REPO_NAME }}
          GITHUB_RELEASE_TAG: "latest"
          MODEL_REPO_TAG: "main"
        run: |
          # Dry run deployment (validates without deploying)
          databricks bundle deploy -t dev --dry-run || true

  run-smoke-tests:
    runs-on: ubuntu-latest
    needs: [validate-job-definitions, validate-bundle]
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run smoke tests
        run: |
          pytest tests/smoke/ -v

