name: "Centene Actuarial Pipeline"
global_entity_id: "pipeline-centene-v1.0.0"
version: "1.0.0"
description: "Centene-specific pipeline with custom transformations"

# Job configuration
max_concurrent_runs: 1
timeout_seconds: 7200
max_retries: 0
min_retry_interval_millis: 1000
task_timeout_seconds: 3600

# Client configuration
client_specific: true
client_entity_id: "client-centene-001"

# Fallback configuration
fallback_job: "default"  # Falls back to default pipeline

# Notebook sequence
# Note: step_2_transform is missing, will fallback to default
notebooks:
  - name: "step_1_data_ingest"
    path: "/Repos/${MODEL_REPO}/notebooks/centene/step_1_data_ingest"
    description: "Centene-specific data ingestion"
    fallback_to: "default"  # Falls back to default if not found
    
  # step_2_transform is intentionally omitted - will use default
  
  - name: "step_3_calculate_model"
    path: "/Repos/${MODEL_REPO}/notebooks/centene/step_3_calculate_model"
    description: "Centene-specific model calculation"
    fallback_to: "default"

schedule: null

